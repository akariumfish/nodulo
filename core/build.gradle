  //api "com.github.tommyettinger:gand:$gandVersion"
  //api "com.github.tommyettinger:gdcrux:$gdcruxVersion"
  //api "com.github.tommyettinger:gdx-TinyVG:$tinyVGVersion"
  //api "com.github.tommyettinger:kryo-digital:$kryoDigitalVersion"
  //api "com.github.tommyettinger:kryo-gand:$kryoGandVersion"
  //api "com.github.tommyettinger:kryo-gdcrux:$kryoGdcruxVersion"
  api "com.github.tommyettinger:kryo-libgdx:$kryoLibgdxVersion"
  api "com.github.tommyettinger:libgdx-texturepacker:$texturePackerOnlyVersion"
  api "com.github.tommyettinger:libgdx-textureunpacker:$textureUnpackerOnlyVersion"
  api "com.github.tommyettinger:libgdx-utils-box2d:$utilsBox2dVersion"
