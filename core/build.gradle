  apply plugin: 'java-library'
  api "com.code-disaster.steamworks4j:steamworks4j:1.10.0"
  api "com.code-disaster.steamworks4j:steamworks4j-gdx:1.10.0"
  api "com.code-disaster.steamworks4j:steamworks4j-lwjgl3:1.10.0"
  api "com.code-disaster.steamworks4j:steamworks4j-server:1.10.0"

